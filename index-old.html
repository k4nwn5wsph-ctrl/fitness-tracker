<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0f1117;
    --surface: #1a1d27;
    --raised:  #222633;
    --border:  rgba(255,255,255,0.07);
    --borderMd:rgba(255,255,255,0.12);
    --text:    #edeef2;
    --textSec: #8b92a8;
    --textMut: #4e5568;
    --danger:  #f87171;
    --bike:    #EF9F27;
    --walk:    #1D9E75;
    --green:   #22c491;
    --grid:    rgba(255,255,255,0.05);
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; padding: 1.5rem; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .sec-label { font-size: 11px; color: var(--textMut); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .btn { padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 8px; background: var(--raised); border: 0.5px solid var(--borderMd); color: var(--text); transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost.active { background: var(--raised); border-color: var(--borderMd); }
  .btn.success { color: var(--green); border-color: rgba(34,196,145,0.3); }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
  .brand-title { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--textSec); }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--textMut); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 500; }
  .stat-value.streak { color: var(--bike); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .form-group label { display: block; font-size: 11px; color: var(--textSec); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .form-group input, .form-group select { width: 100%; font-size: 13px; background: var(--raised); border: 0.5px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 10px; outline: none; }
  .form-group select option { background: var(--raised); }
  .err { font-size: 12px; color: var(--danger); margin-bottom: 10px; }
  .chart-wrap { position: relative; width: 100%; height: 180px; }
  .monthly-table, .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .monthly-table th, .log-table th { padding: 8px 12px 10px 0; text-align: left; font-size: 11px; color: var(--textMut); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 400; white-space: nowrap; }
  .monthly-table td, .log-table td { padding: 10px 12px 10px 0; border-top: 0.5px solid var(--border); }
  .log-table th, .log-table td { padding: 9px 14px; }
  .log-table thead tr { background: var(--raised); }
  .log-table tbody tr:hover { background: rgba(255,255,255,0.02); }
  .log-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem; }
  .log-scroll { overflow-x: auto; }
  .badge { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge-bike { background: rgba(239,159,39,0.15); color: #f0a832; }
  .badge-walk { background: rgba(29,158,117,0.15); color: #22c491; }
  .pr-flag { margin-left: 6px; font-size: 11px; color: var(--green); font-weight: 500; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--textMut); font-size: 16px; line-height: 1; padding: 0 4px; }
  .del-btn:hover { color: var(--danger); }
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .tab-group { display: flex; gap: 4px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; padding: 3px; }
  .empty-row td { padding: 24px; text-align: center; color: var(--textMut); }
  .heatmap-container { width: 100%; }
  .heatmap-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
  .heatmap-label { width: 28px; font-size: 10px; color: var(--textMut); text-align: right; padding-right: 4px; flex-shrink: 0; }
  .heatmap-month-row { display: flex; gap: 5px; margin-bottom: 6px; }
  .heatmap-month-label { width: 28px; flex-shrink: 0; }
  .heatmap-month-cell { flex: 1; font-size: 10px; color: var(--textMut); text-align: center; }
  .heatmap-cell-wrap { flex: 1; }
  .heatmap-cell { width: 100%; padding-bottom: 100%; border-radius: 3px; position: relative; overflow: hidden; cursor: default; }
  .heatmap-cell.has-workout { cursor: pointer; }
  .heatmap-tooltip { margin-top: 8px; font-size: 12px; color: var(--textSec); min-height: 18px; }
  .heatmap-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 11px; color: var(--textMut); }
  .heatmap-legend span { display: flex; align-items: center; gap: 5px; }
  .heatmap-legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #form-section { display: none; }
  #heatmap-section { display: none; }
  .hidden { display: none !important; }
  @media (max-width: 500px) {
    body { padding: 1rem; }
    .stat-value { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-title">Fitness Tracker</div>
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--bike)"></span>Indoor bike</span>
        <span><span class="legend-dot" style="background:var(--walk)"></span>Outdoor walk</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="export-btn" onclick="exportCSV()">Export CSV</button>
      <button class="btn" onclick="toggleForm()" id="form-toggle-btn">+ Log workout</button>
    </div>
  </header>

  <div id="form-section" class="card">
    <div class="sec-label">New workout</div>
    <div class="form-grid">
      <div class="form-group"><label>Date</label><input type="date" id="f-date"></div>
      <div class="form-group"><label>Type</label>
        <select id="f-type"><option value="bike">Indoor bike</option><option value="walk">Outdoor walk</option></select>
      </div>
      <div class="form-group"><label>Duration (min)*</label><input type="number" id="f-duration" placeholder="40"></div>
      <div class="form-group"><label>Avg HR (bpm)*</label><input type="number" id="f-avgHR" placeholder="150"></div>
      <div class="form-group"><label>Max HR (bpm)</label><input type="number" id="f-maxHR" placeholder="170"></div>
      <div class="form-group"><label>Calories</label><input type="number" id="f-calories" placeholder="450"></div>
      <div class="form-group"><label>Distance (mi)</label><input type="number" id="f-distance" placeholder="1.5" step="0.01"></div>
    </div>
    <div class="err hidden" id="form-err">Duration and avg HR are required.</div>
    <button class="btn" onclick="saveWorkout()">Save workout</button>
  </div>

  <div class="sec-label">Overview</div>
  <div class="stats-grid" id="stats-grid"></div>

  <div class="card">
    <div class="sec-label">Monthly summary</div>
    <div id="monthly-summary"></div>
  </div>

  <div class="card">
    <div class="sec-label">Session duration</div>
    <div class="chart-wrap"><canvas id="duration-chart" role="img" aria-label="Bar chart of workout session durations"></canvas></div>
  </div>

  <div class="card">
    <div class="sec-label">Avg heart rate trend</div>
    <div style="font-size:12px;color:var(--textMut);margin-bottom:12px;margin-top:-6px">Dot color indicates workout type</div>
    <div class="chart-wrap"><canvas id="hr-chart" role="img" aria-label="Line chart of average heart rate over time"></canvas></div>
  </div>

  <div class="log-header">
    <div class="sec-label" style="margin-bottom:0">Workout log</div>
    <div class="tab-group">
      <button class="btn ghost active" id="tab-table" onclick="switchTab('table')">Table</button>
      <button class="btn ghost" id="tab-heatmap" onclick="switchTab('heatmap')">Heatmap</button>
    </div>
  </div>

  <div id="table-section">
    <div class="log-wrap">
      <div class="log-scroll">
        <table class="log-table">
          <thead><tr>
            <th>Date</th><th>Type</th><th>Duration</th><th>Calories</th>
            <th>Avg HR</th><th>Max HR</th><th>Distance</th><th></th>
          </tr></thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="heatmap-section" class="card">
    <div class="heatmap-container" id="heatmap"></div>
  </div>

</div>

<script>
const BIKE = '#EF9F27', WALK = '#1D9E75';

const SEED = [
  { id:100, date:'2026-04-22', type:'bike', duration:42, calories:508, avgHR:159, maxHR:175, distance:0 },
  { id:101, date:'2026-04-23', type:'walk', duration:38, calories:160, avgHR:101, maxHR:0,   distance:1.57 },
  { id:102, date:'2026-04-23', type:'walk', duration:83, calories:367, avgHR:106, maxHR:0,   distance:3.95 },
  { id:103, date:'2026-04-24', type:'bike', duration:40, calories:435, avgHR:147, maxHR:160, distance:0 },
  { id:104, date:'2026-04-25', type:'walk', duration:34, calories:152, avgHR:101, maxHR:0,   distance:1.63 },
  { id:105, date:'2026-04-26', type:'bike', duration:40, calories:502, avgHR:157, maxHR:172, distance:0 },
];

let workouts = [];
let durationChart, hrChart;

function loadData() {
  try {
    const stored = JSON.parse(localStorage.getItem('workouts') || '[]');
    const base = Array.isArray(stored) ? stored : [];
    const storedIds = new Set(base.map(w => w.id));
    workouts = [...base, ...SEED.filter(s => !storedIds.has(s.id))];
  } catch { workouts = [...SEED]; }
  saveData();
}

function saveData() {
  localStorage.setItem('workouts', JSON.stringify(workouts));
}

function sorted() {
  return [...workouts].sort((a, b) => a.date.localeCompare(b.date));
}

function fmtDate(s) {
  return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function getPRs() {
  const best = { bike:0, walk:0 };
  for (const w of workouts) best[w.type] = Math.max(best[w.type], Number(w.duration));
  return new Set(workouts.filter(w => Number(w.duration) === best[w.type]).map(w => w.id));
}

function getStreak() {
  if (!workouts.length) return 0;
  const days = new Set(workouts.map(w => w.date));
  let streak = 0;
  const d = new Date(); d.setHours(12,0,0,0);
  if (!days.has(d.toISOString().split('T')[0])) d.setDate(d.getDate() - 1);
  while (true) {
    const str = d.toISOString().split('T')[0];
    if (!days.has(str)) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderStats() {
  const total = workouts.length;
  const totalMins = workouts.reduce((s, w) => s + Number(w.duration), 0);
  const avgDur = total ? Math.round(totalMins / total) : 0;
  const streak = getStreak();
  const stats = [
    ['Workouts', total, false],
    ['Total time', `${Math.floor(totalMins/60)}h ${totalMins%60}m`, false],
    ['Avg duration', `${avgDur} min`, false],
    ['Current streak', `${streak} day${streak !== 1 ? 's' : ''}`, streak > 0],
  ];
  document.getElementById('stats-grid').innerHTML = stats.map(([lbl, val, highlight]) =>
    `<div class="stat-card">
      <div class="stat-label">${lbl}</div>
      <div class="stat-value${highlight ? ' streak' : ''}">${val}</div>
    </div>`
  ).join('');
}

function renderMonthly() {
  const months = {};
  for (const w of workouts) {
    const key = w.date.slice(0,7);
    if (!months[key]) months[key] = { count:0, mins:0, calories:0 };
    months[key].count++;
    months[key].mins += Number(w.duration);
    months[key].calories += Number(w.calories);
  }
  const rows = Object.entries(months).sort((a,b) => a[0].localeCompare(b[0])).map(([key, v]) => {
    const label = new Date(key + '-01').toLocaleDateString('en-US', { month:'short', year:'numeric' });
    return `<tr>
      <td style="color:var(--textSec);font-weight:500">${label}</td>
      <td>${v.count}</td>
      <td>${Math.floor(v.mins/60)}h ${v.mins%60}m</td>
      <td>${v.calories} cal</td>
    </tr>`;
  }).join('');
  document.getElementById('monthly-summary').innerHTML = rows
    ? `<table class="monthly-table">
        <thead><tr><th>Month</th><th>Workouts</th><th>Total time</th><th>Calories</th></tr></thead>
        <tbody>${rows}</tbody>
       </table>`
    : `<div style="font-size:13px;color:var(--textMut)">No data yet.</div>`;
}

function renderLog() {
  const prs = getPRs();
  const rows = [...sorted()].reverse().map(w => `
    <tr>
      <td style="color:var(--textSec);white-space:nowrap">${fmtDate(w.date)}</td>
      <td style="white-space:nowrap"><span class="badge badge-${w.type}">${w.type === 'bike' ? 'Bike' : 'Walk'}</span></td>
      <td style="white-space:nowrap">${w.duration} min${prs.has(w.id) ? '<span class="pr-flag">PR</span>' : ''}</td>
      <td>${w.calories ? w.calories + ' cal' : '—'}</td>
      <td>${w.avgHR} bpm</td>
      <td style="color:var(--textSec)">${w.maxHR ? w.maxHR + ' bpm' : '—'}</td>
      <td style="color:var(--textSec)">${w.distance ? w.distance + ' mi' : '—'}</td>
      <td><button class="del-btn" onclick="deleteWorkout(${w.id})">×</button></td>
    </tr>`).join('');
  document.getElementById('log-body').innerHTML = rows ||
    `<tr class="empty-row"><td colspan="8">No workouts yet. Log your first one above.</td></tr>`;
}

function renderCharts() {
  const s = sorted();
  const labels = s.map(w => fmtDate(w.date));
  const durations = s.map(w => Number(w.duration));
  const hrs = s.map(w => Number(w.avgHR));
  const bgColors = s.map(w => w.type === 'bike' ? BIKE : WALK);
  const gridColor = 'rgba(255,255,255,0.05)';
  const tickColor = '#4e5568';
  const axisOpts = { grid: { color: gridColor, drawBorder: false }, ticks: { color: tickColor, font: { size: 11 } }, border: { display: false } };

  if (durationChart) durationChart.destroy();
  durationChart = new Chart(document.getElementById('duration-chart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: durations, backgroundColor: bgColors, borderRadius: 3, borderSkipped: false }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.raw} min` } } },
      scales: {
        x: { ...axisOpts, grid: { display: false } },
        y: { ...axisOpts, max: 100, ticks: { ...axisOpts.ticks, callback: v => v + 'm' } }
      }
    }
  });

  if (hrChart) hrChart.destroy();
  hrChart = new Chart(document.getElementById('hr-chart'), {
    type: 'line',
    data: { labels, datasets: [{
      data: hrs,
      borderColor: '#4e5568', borderWidth: 1.5,
      pointBackgroundColor: bgColors, pointRadius: 5, pointHoverRadius: 7,
      tension: 0, fill: false,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.raw} bpm` } } },
      scales: {
        x: { ...axisOpts, grid: { display: false } },
        y: { ...axisOpts }
      }
    }
  });
}

function renderHeatmap() {
  const tod = new Date(); tod.setHours(12,0,0,0);
  const start = new Date(tod);
  start.setDate(tod.getDate() - tod.getDay() - 28);
  const byDate = {};
  for (const w of workouts) {
    if (!byDate[w.date]) byDate[w.date] = [];
    byDate[w.date].push(w.type);
  }
  const weeks = [];
  const cur = new Date(start);
  for (let wk = 0; wk < 5; wk++) {
    const days = [];
    for (let d = 0; d < 7; d++) {
      const str = cur.toISOString().split('T')[0];
      days.push({ date: str, day: cur.getDate(), types: byDate[str] || [], isFuture: cur > tod });
      cur.setDate(cur.getDate() + 1);
    }
    weeks.push(days);
  }
  const todStr = tod.toISOString().split('T')[0];
  const dayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let html = `<div class="heatmap-month-row"><div class="heatmap-month-label"></div>`;
  weeks.forEach(week => {
    const first = week.find(d => d.day === 1);
    const lbl = first ? new Date(first.date + 'T12:00:00').toLocaleDateString('en-US', { month:'short' }) : '';
    html += `<div class="heatmap-month-cell">${lbl}</div>`;
  });
  html += `</div>`;

  for (let di = 0; di < 7; di++) {
    html += `<div class="heatmap-row">`;
    html += `<div class="heatmap-label">${di % 2 === 1 ? dayLabels[di] : ''}</div>`;
    weeks.forEach(week => {
      const day = week[di];
      const hasBike = day.types.includes('bike');
      const hasWalk = day.types.includes('walk');
      const isBoth = hasBike && hasWalk;
      const isToday = day.date === todStr;
      let bg = 'var(--raised)';
      if (day.isFuture) bg = 'transparent';
      else if (hasBike && !hasWalk) bg = BIKE;
      else if (hasWalk && !hasBike) bg = WALK;
      const border = isToday ? '1.5px solid var(--borderMd)' : '0.5px solid var(--border)';
      const cursor = day.types.length ? 'pointer' : 'default';
      html += `<div class="heatmap-cell-wrap">
        <div class="heatmap-cell${day.types.length ? ' has-workout' : ''}"
          style="background:${isBoth ? 'transparent' : bg};border:${border};cursor:${cursor}"
          onmouseenter="showHeatmapTip('${day.date}','${day.types.join(',')}')"
          onmouseleave="clearHeatmapTip()">
          ${isBoth ? `
            <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:${BIKE};clip-path:polygon(0 0,100% 0,0 100%)"></div>
            <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:${WALK};clip-path:polygon(100% 0,100% 100%,0 100%)"></div>
          ` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="heatmap-tooltip" id="heatmap-tip"></div>`;
  html += `<div class="heatmap-legend">
    <span><span class="heatmap-legend-dot" style="background:${BIKE}"></span>Bike</span>
    <span><span class="heatmap-legend-dot" style="background:${WALK}"></span>Walk</span>
    <span><span class="heatmap-legend-dot" style="background:var(--raised);border:0.5px solid var(--border)"></span>Rest</span>
  </div>`;

  document.getElementById('heatmap').innerHTML = html;
}

function showHeatmapTip(date, typesStr) {
  const el = document.getElementById('heatmap-tip');
  if (!el || !typesStr) return;
  const types = typesStr.split(',').filter(Boolean).map(t => t === 'bike' ? 'Indoor bike' : 'Outdoor walk');
  el.textContent = `${fmtDate(date)} — ${types.join(' + ')}`;
}

function clearHeatmapTip() {
  const el = document.getElementById('heatmap-tip');
  if (el) el.textContent = '';
}

function renderAll() {
  renderStats();
  renderMonthly();
  renderLog();
  renderCharts();
  renderHeatmap();
}

function toggleForm() {
  const sec = document.getElementById('form-section');
  const btn = document.getElementById('form-toggle-btn');
  const open = sec.style.display === 'block';
  sec.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '+ Log workout' : 'Cancel';
  if (!open) document.getElementById('f-date').value = today();
}

function saveWorkout() {
  const duration = Number(document.getElementById('f-duration').value);
  const avgHR = Number(document.getElementById('f-avgHR').value);
  const err = document.getElementById('form-err');
  if (!duration || !avgHR) { err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  workouts.push({
    id: Date.now(),
    date: document.getElementById('f-date').value || today(),
    type: document.getElementById('f-type').value,
    duration, avgHR,
    maxHR: Number(document.getElementById('f-maxHR').value) || 0,
    calories: Number(document.getElementById('f-calories').value) || 0,
    distance: Number(document.getElementById('f-distance').value) || 0,
  });
  saveData();
  renderAll();
  toggleForm();
  ['f-duration','f-avgHR','f-maxHR','f-calories','f-distance'].forEach(id => document.getElementById(id).value = '');
}

function deleteWorkout(id) {
  workouts = workouts.filter(w => w.id !== id);
  saveData();
  renderAll();
}

function switchTab(view) {
  document.getElementById('table-section').style.display = view === 'table' ? 'block' : 'none';
  document.getElementById('heatmap-section').style.display = view === 'heatmap' ? 'block' : 'none';
  document.getElementById('tab-table').classList.toggle('active', view === 'table');
  document.getElementById('tab-heatmap').classList.toggle('active', view === 'heatmap');
}

function exportCSV() {
  const headers = ['Date','Type','Duration (min)','Calories','Avg HR (bpm)','Max HR (bpm)','Distance (mi)'];
  const rows = sorted().map(w => [
    w.date,
    w.type === 'bike' ? 'Indoor bike' : 'Outdoor walk',
    w.duration, w.calories || '', w.avgHR, w.maxHR || '', w.distance || ''
  ]);
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  navigator.clipboard.writeText(csv).then(() => {
    const btn = document.getElementById('export-btn');
    btn.textContent = '✓ Copied';
    btn.classList.add('success');
    setTimeout(() => { btn.textContent = 'Export CSV'; btn.classList.remove('success'); }, 2500);
  }).catch(() => {
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fitness-tracker.csv';
    a.click();
  });
}

loadData();
renderAll();
</script>
</body>
</html>
